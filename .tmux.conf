# Prefix: Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Clipboard — Wayland (wl-copy)
set -g set-clipboard on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Index từ 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal màu đầy đủ
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g alternate-screen on

# Không delay ESC (quan trọng cho nvim)
set -sg escape-time 0
set -g history-limit 10000

# Split bằng | và -  (giữ current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Di chuyển pane bằng vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New session / chọn session
bind N new-session
bind S choose-session
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Tmux-power gold theme — layout + mau goc tu tmux-power
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=#262626,fg=#626262"
set -g status-justify left

# Left: user@host (gold) -> session (grey)
set -g status-left "#[fg=#262626,bg=#ffb86c,bold]  #{USER}@#h #[fg=#ffb86c,bg=#3a3a3a,none]#[fg=#ffb86c,bg=#3a3a3a]  #S #[fg=#3a3a3a,bg=#262626,none]"
set -g status-left-length 120

# Right: time (grey) -> date (gold)
set -g status-right "#[fg=#3a3a3a,bg=#262626,none]#[fg=#ffb86c,bg=#3a3a3a]  %H:%M #[fg=#ffb86c,bg=#3a3a3a,none]#[fg=#262626,bg=#ffb86c,bold]  %d/%m "
set -g status-right-length 120

# Window tabs powerline: inactive grey/gold, active dao mau (gold bg, dark text)
set -g window-status-format "#[fg=#262626,bg=#3a3a3a,none]#[fg=#ffb86c,bg=#3a3a3a] #I:#W #[fg=#ffb86c,bg=#3a3a3a,dim]#{@git_branch} #[fg=#3a3a3a,bg=#262626,none]"
set -g window-status-current-format "#[fg=#262626,bg=#ffb86c,none]#[fg=#262626,bg=#ffb86c,bold] #I:#W #[fg=#3a3a3a,bg=#ffb86c]#{@git_branch} #[fg=#ffb86c,bg=#262626,none]"
set -g window-status-separator ""

# Pane border
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#ffb86c"

# Message style
set -g message-style "bg=#1e2124,fg=#ffffff"

# tmux-resurrect — lưu/restore session
set -g @resurrect-capture-pane-contents 'on'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

# tmux-continuum — tự động lưu mỗi 15 phút, restore khi start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux

# Per-window git branch (vòng lặp nền, cập nhật @git_branch mỗi 5s)
run-shell -b ~/.tmux/scripts/git-branch-loop.sh
