# Prefix: Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Clipboard — Wayland (wl-copy)
set -g set-clipboard on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Index từ 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal màu đầy đủ
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g alternate-screen on

# Không delay ESC (quan trọng cho nvim)
set -sg escape-time 0
set -g history-limit 10000

# Split bằng | và -  (giữ current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Di chuyển pane bằng vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New session / chọn session
bind N new-session
bind S choose-session
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Catppuccin mocha — powerline pills (thay theme gold cu)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Uptime: goi script rieng (khong chua ngoac/pipe/space trong #(...) de tranh loi parse).
set -g @catppuccin_uptime_text "#(/home/kane/Dev/tmux-config/uptime.sh)"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status line: tabs trai, modules phai (giong mau mocha)
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# session/uptime: -ag (khong F) de giu live — render moi 2s.
# cpu/battery: -agF de inline placeholder #{cpu_...}/#{battery_...} cho script
# cua tmux-cpu/tmux-battery thay the (thep dung README cua catppuccin).
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Modules phu thuoc
run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux

# Pane border (mocha mauve cho hop theme)
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

# Message style
set -g message-style "bg=#1e2124,fg=#ffffff"

# tmux-resurrect — lưu/restore session
set -g @resurrect-capture-pane-contents 'on'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

# tmux-continuum — tự động lưu mỗi 15 phút, restore khi start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux

# Per-window git branch (vòng lặp nền, cập nhật @git_branch mỗi 5s)
run-shell -b ~/.tmux/scripts/git-branch-loop.sh
